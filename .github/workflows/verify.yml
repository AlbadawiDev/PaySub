name: Verify PaySub
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paysub-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/phpunit/phpunit/phpunit
      - run: composer audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paysub-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: paysub-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm audit
